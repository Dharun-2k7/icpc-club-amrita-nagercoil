<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel - ICPC Club Amrita Nagercoil</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .admin-container {
      max-width: 1000px;
      margin: 100px auto;
      padding: 20px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }
    .admin-tabs {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
    }
    .tab-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 8px 16px;
      color: #fff;
      border-radius: 4px;
      cursor: pointer;
    }
    .tab-btn.active {
      background: #0D9488;
      border-color: #0D9488;
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }
    .form-group {
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      margin-bottom: 5px;
    }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%;
      padding: 10px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(0, 0, 0, 0.2);
      color: #fff;
    }
    .data-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    .data-table th, .data-table td {
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      text-align: left;
    }
    .data-table th {
      background: rgba(255, 255, 255, 0.05);
    }
  </style>
</head>
<body>
  <!-- Navigation -->
  <header class="hero" style="min-height: auto; padding-bottom: 0;">
    <nav class="navbar">
      <div class="brand-wrapper">
        <a class="brand" href="index.html">ICPC Club <span>Amrita Nagercoil</span></a>
      </div>
      <div class="nav-actions">
        <a href="dashboard.html" class="btn btn-outline">Dashboard</a>
        <button class="btn btn-join" id="admin-logout-btn">Log Out</button>
      </div>
    </nav>
  </header>

  <main class="container admin-container">
    <div class="admin-header">
      <h2>Admin Panel</h2>
    </div>

    <div class="admin-tabs">
      <button class="tab-btn active" onclick="switchTab('sessions-tab')">Manage Sessions</button>
      <button class="tab-btn" onclick="switchTab('attendance-tab')">Track Attendance</button>
    </div>

    <!-- Create Session Tab -->
    <div id="sessions-tab" class="tab-content active">
      <h3>Create New Session/Meeting</h3>
      <form id="create-session-form">
        <div class="form-group">
          <label>Title</label>
          <input type="text" id="session-title" required />
        </div>
        <div class="form-group">
          <label>Date & Time</label>
          <input type="datetime-local" id="session-date" required />
        </div>
        <div class="form-group">
          <label>Type</label>
          <select id="session-type">
            <option value="session">Session</option>
            <option value="meeting">Meeting</option>
          </select>
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea id="session-desc" rows="3"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Create Session</button>
      </form>
      <div id="session-msg" style="margin-top: 10px;"></div>
    </div>

    <!-- Attendance Tab -->
    <div id="attendance-tab" class="tab-content">
      <h3>Mark Attendance</h3>
      <div class="form-group">
        <label>Select Session</label>
        <select id="attendance-session-select" onchange="loadStudents()">
          <option value="">-- Select a Session --</option>
        </select>
      </div>
      
      <table class="data-table" id="attendance-table" style="display:none;">
        <thead>
          <tr>
            <th>Name</th>
            <th>Roll Number</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="attendance-tbody"></tbody>
      </table>
    </div>
  </main>

  <script>
    const token = localStorage.getItem('icpc_token');
    if (!token) {
      window.location.href = 'login.html';
    }

    document.getElementById('admin-logout-btn').addEventListener('click', () => {
      localStorage.removeItem('icpc_token');
      localStorage.removeItem('icpc_user');
      window.location.href = 'index.html';
    });

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      event.target.classList.add('active');

      if (tabId === 'attendance-tab') {
        loadSessionsForAttendance();
      }
    }

    // Create Session
    document.getElementById('create-session-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button');
      btn.disabled = true;
      
      const payload = {
        title: document.getElementById('session-title').value,
        date: new Date(document.getElementById('session-date').value).toISOString(),
        type: document.getElementById('session-type').value,
        description: document.getElementById('session-desc').value
      };

      try {
        const res = await fetch('/api/sessions', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        
        const msgEl = document.getElementById('session-msg');
        if (res.ok) {
          msgEl.style.color = '#0D9488';
          msgEl.textContent = 'Session created successfully!';
          e.target.reset();
        } else {
          msgEl.style.color = '#E11D48';
          msgEl.textContent = data.message || 'Error creating session';
        }
      } catch (err) {
        console.error(err);
      } finally {
        btn.disabled = false;
      }
    });

    // Load Sessions for Attendance Select
    async function loadSessionsForAttendance() {
      try {
        const res = await fetch('/api/sessions');
        const sessions = await res.json();
        const select = document.getElementById('attendance-session-select');
        select.innerHTML = '<option value="">-- Select a Session --</option>';
        sessions.forEach(s => {
          const d = new Date(s.date).toLocaleString();
          select.innerHTML += \`<option value="\${s.id}">\${s.title} (\${d})</option>\`;
        });
      } catch (err) {
        console.error(err);
      }
    }

    // Load Students and their attendance for selected session
    async function loadStudents() {
      const sessionId = document.getElementById('attendance-session-select').value;
      const table = document.getElementById('attendance-table');
      const tbody = document.getElementById('attendance-tbody');
      
      if (!sessionId) {
        table.style.display = 'none';
        return;
      }

      try {
        // Fetch all students
        const resSt = await fetch('/api/students', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        const students = await resSt.json();

        // Fetch attendance for this session
        const resAtt = await fetch(\`/api/attendance?session_id=\${sessionId}\`);
        const attendanceData = await resAtt.json();
        const attMap = {};
        if (Array.isArray(attendanceData)) {
          attendanceData.forEach(a => {
            attMap[a.student_id] = a.status;
          });
        }

        tbody.innerHTML = '';
        students.forEach(st => {
          const status = attMap[st.id] || 'absent';
          const isPresent = status === 'present';
          
          tbody.innerHTML += \`
            <tr>
              <td>\${st.student_name}</td>
              <td>\${st.roll_number}</td>
              <td id="status-\${st.id}" style="color: \${isPresent ? '#0D9488' : '#E11D48'}">\${status.toUpperCase()}</td>
              <td>
                <button onclick="markAttendance(\${sessionId}, \${st.id}, 'present')" class="btn btn-outline" style="padding: 4px 8px; font-size: 12px;">Mark Present</button>
                <button onclick="markAttendance(\${sessionId}, \${st.id}, 'absent')" class="btn btn-outline" style="padding: 4px 8px; font-size: 12px; border-color: #E11D48; color: #E11D48;">Mark Absent</button>
              </td>
            </tr>
          \`;
        });
        table.style.display = 'table';
      } catch (err) {
        console.error(err);
        alert('Error loading students. Ensure you have admin privileges.');
      }
    }

    window.markAttendance = async function(sessionId, studentId, status) {
      try {
        const res = await fetch('/api/attendance', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify({ session_id: sessionId, student_id: studentId, status })
        });
        
        if (res.ok) {
          const statusEl = document.getElementById(\`status-\${studentId}\`);
          statusEl.textContent = status.toUpperCase();
          statusEl.style.color = status === 'present' ? '#0D9488' : '#E11D48';
        } else {
          const data = await res.json();
          alert(data.message || 'Error marking attendance');
        }
      } catch (err) {
        console.error(err);
      }
    };
  </script>
</body>
</html>
