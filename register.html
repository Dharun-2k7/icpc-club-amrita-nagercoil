<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - ICPC Club Amrita Nagercoil</title>
    <meta name="description" content="Register for the ICPC Club Amrita Nagercoil." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" type="image/webp" href="images/icpc.webp" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Background Blur Orbs -->
    <div class="glow-orb orb-red" aria-hidden="true"></div>
    <div class="glow-orb orb-blue" aria-hidden="true"></div>
    <div class="glow-orb orb-yellow" aria-hidden="true"></div>

    <header class="hero join-hero">
      <nav class="navbar">
        <div class="brand-wrapper">
          <a class="edge-logo" href="https://icpc.foundation" target="_blank" rel="noopener noreferrer">
            <img src="images/icpc.webp" alt="ICPC Foundation linked club logo" class="edge-logo-img" />
          </a>
          <a class="brand" href="index.html">ICPC Club <span>Amrita Nagercoil</span></a>
        </div>

        <div class="nav-links">
          <a href="about.html">About</a>
          <a href="roadmap.html">Roadmap</a>
          <a href="why-join.html">Why Join</a>
          <a href="events.html">Events</a>
          <a href="team.html">Team</a>
          <a href="gallery.html">Gallery</a>
          <a href="announcements.html">Announcements</a>
          <a href="contact.html">Contact</a>
        </div>

        <div class="nav-actions">
          <a href="register.html" class="btn btn-join">Join Us</a>
        </div>

        <button class="menu-toggle" aria-label="Toggle navigation">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </nav>
      
      <div class="hero-content" id="join-us">
          <h1>Student <span class="text-grad-solve">Registration</span></h1>
        </div>
      </div>
    </header>

    <main>
      <section class="section">
        <div class="container join-container">
          <!-- Glassmorphic Form Card -->
          <div class="join-card" style="grid-column: 1 / -1; width: 100%; max-width: 600px; margin: 0 auto;">
            <h2 style="margin-bottom: 0.5rem; text-align: center;">Join the Community</h2>
            <p style="text-align: center; margin-bottom: 2rem;">
              Please provide your student details and Codeforces handle to register.
            </p>
            <form id="registration-form" class="join-form">
              <div class="form-group">
                <label for="student_name">Full Name</label>
                <input id="student_name" name="student_name" type="text" placeholder="Your full name" required />
              </div>
              <div class="form-group">
                <label for="roll_number">Roll Number</label>
                <input id="roll_number" name="roll_number" type="text" placeholder="e.g. NC.SC.U4CSE25004" required />
              </div>
              <div class="form-group">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" placeholder="Create a password" required />
              </div>
              <div class="form-group">
                <label for="class_name">Class / Department</label>
                <input id="class_name" name="class_name" type="text" placeholder="e.g. B.Tech CYS" required />
              </div>
              <div class="form-group">
                <label for="batch">Batch</label>
                <input id="batch" name="batch" type="text" placeholder="e.g. 2026-2030" required />
              </div>
              <div class="form-group">
                <label for="codeforces_handle">Codeforces Handle</label>
                <input id="codeforces_handle" name="codeforces_handle" type="text" placeholder="Your Codeforces username" required />
              </div>

              <!-- Status Message -->
              <div id="form-status" style="margin-top: 1rem; text-align: center; font-weight: 600; display: none;"></div>

              <button type="submit" id="submit-btn" class="btn btn-primary" style="margin-top: 1.5rem; width: 100%;">Complete Registration</button>
            </form>
          </div>
        </div>
      </section>
    </main>

    <script>
      document.getElementById('registration-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const btn = document.getElementById('submit-btn');
        const statusEl = document.getElementById('form-status');
        
        btn.textContent = 'Registering...';
        btn.disabled = true;
        statusEl.style.display = 'none';

        const payload = {
          student_name: document.getElementById('student_name').value.trim(),
          roll_number: document.getElementById('roll_number').value.trim(),
          password: document.getElementById('password').value,
          class_name: document.getElementById('class_name').value.trim(),
          batch: document.getElementById('batch').value.trim(),
          codeforces_handle: document.getElementById('codeforces_handle').value.trim(),
        };

        try {
          const res = await fetch('/api/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          
          const data = await res.json();
          
          statusEl.style.display = 'block';
          if (res.ok) {
            statusEl.style.color = '#0D9488'; // Teal success
            statusEl.textContent = 'Registration successful! Welcome to the club.';
            e.target.reset();
          } else {
            statusEl.style.color = '#E11D48'; // Red error
            statusEl.textContent = data.message || 'An error occurred. Please try again.';
          }
        } catch (error) {
          statusEl.style.display = 'block';
          statusEl.style.color = '#E11D48';
          statusEl.textContent = 'Network error. Please try again.';
        } finally {
          btn.textContent = 'Complete Registration';
          btn.disabled = false;
        }
      });
    </script>
    <script src="script.js" defer></script>
  </body>
</html>
